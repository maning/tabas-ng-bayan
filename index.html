<!DOCTYPE html>
<html>
<head>
  <title>Topomap Mosaic</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // --- Your list of MapWarper sheet IDs (1:50k series) ---
    const sheetIds = [9211, 9198, 9205, 9200, 9206, 9207, 9211, 9212, 9191];

    // --- Initialize Leaflet map ---
    const map = L.map('map').setView([8.1955, 117.2279], 10);

    // --- Base layer (OSM) ---
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // --- 1:50k Topomap Mosaic Group ---
    const topo50kGroup = L.layerGroup();

    sheetIds.forEach(id => {
      const url = `https://warper.wmflabs.org/maps/tile/${id}/{z}/{x}/{y}.png`;
      const layer = L.tileLayer(url, {
        opacity: 0.9,
        attribution: `&copy; <a href="https://warper.wmflabs.org/maps/${id}" target="_blank">MapWarper ${id}</a>`
      });
      topo50kGroup.addLayer(layer);
    });

    // --- 1:250k AMS Layer ---
    const topo250k = L.tileLayer('https://tabas-ng-bayan.s3.amazonaws.com/tiles/250k-AMS/{z}/{x}/{y}.png', {
      maxZoom: 12,
      opacity: 0.9,
      attribution: '&copy; AMS 1:250,000 Map Series'
    });

    // --- Add both to map initially (optional: you can start with only one) ---
    topo50kGroup.addTo(map);
    // topo250k.addTo(map); // uncomment if you want it visible on load

    // --- Layer controls ---
    const baseLayers = {
      'OpenStreetMap': osm
    };

    const overlayLayers = {
      '1:50k Topo (MapWarper)': topo50kGroup,
      '1:250k AMS': topo250k
    };

    L.control.layers(baseLayers, overlayLayers, { collapsed: false }).addTo(map);
  </script>
</body>
</html>
