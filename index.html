<!DOCTYPE html>
<html>
<head>
  <title>Topomap Mosaic</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // --- Your list of MapWarper sheet IDs ---
    const sheetIds = [9211, 9198, 9205, 9200, 9206, 9207, 9211, 9212,
    9191];

    // --- Initialize Leaflet map ---
    const map = L.map('map').setView([8.1955, 117.2279], 10); 

    // --- Base layer (OSM) ---
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // --- Create a group layer for your topo maps ---
    const topoGroup = L.layerGroup();

    // --- Add each MapWarper TMS layer ---
    sheetIds.forEach(id => {
      const url = `https://warper.wmflabs.org/maps/tile/${id}/{z}/{x}/{y}.png`;
      const layer = L.tileLayer(url, {
        opacity: 0.95, // slightly transparent so it blends with OSM
        //attribution: 'Mapwarper / Wikimedia Labs'
        attribution: `&copy; <a href="https://warper.wmflabs.org/maps/${id}" target="_blank">MapWarper ${id}</a>`
      });
      topoGroup.addLayer(layer);
    });

    // --- Add the topoGroup to map ---
    topoGroup.addTo(map);

    // --- Optional: Layer control toggle ---
    L.control.layers({ 'OpenStreetMap': osm }, { '1:50k Topo': topoGroup }).addTo(map);
  </script>
</body>
</html>
